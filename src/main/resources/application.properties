server.port=8080

# ==========================================
# Local MySQL Database Configuration
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:github_bot}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Pandaa@2607}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# GitHub OAuth2 Client Configuration
# ==========================================
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:dummy_client_id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:dummy_client_secret}
spring.security.oauth2.client.registration.github.scope=read:user,user:email,repo

# ==========================================
# GitHub Webhook & API Automation Secrets
# ==========================================
app.github.webhook-secret=${GITHUB_WEBHOOK_SECRET:development_secret_token}
app.github.bot-token=${GITHUB_BOT_TOKEN:}
app.github.api-url=https://api.github.com

# ==========================================
# Slack Integration
# ==========================================
app.slack.webhook-url=${SLACK_WEBHOOK_URL:}

# ==========================================
# Gemini AI Configuration (Stretch Goal)
# ==========================================
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# Thread pool for asynchronous webhook processing
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100





